name: Verify application
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx --no-install playwright-core install --with-deps chromium
      - name: Browser smoke checks without credentials
        run: |
          npm start -- --hostname 127.0.0.1 > /tmp/han-phong-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then break; fi
            sleep 1
          done
          TEST_BASE_URL=http://127.0.0.1:3000 npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
